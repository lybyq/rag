name: rag-intranet-release

# =============================================================================
# 内网测试编排（external-dev + Mock Auth）
#
# 只启动 6 个应用容器 + 1 个一次性 bootstrap。PostgreSQL、Redis、MinIO、Milvus、
# PaddleOCR、Embedding、Reranker、LLM 全部使用 .env 指向的现有内网服务，不在本
# Compose 内部署，也不访问公网。
#
# bootstrap 成功（数据库迁移 + MinIO 建桶）后，6 个应用才会启动。
# 仅 Web Console 暴露 8080；其余服务仅在 rag-net 内部网络可达。
# 镜像 tag 固定为 0.1.0-dev，禁止 latest。
# =============================================================================

x-backend: &backend
  restart: unless-stopped
  env_file:
    - path: ./.env
      required: true
  networks: [rag-net]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: '50m'
      max-file: '5'
  stop_grace_period: 30s

x-app-healthcheck: &app-healthcheck
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 20s

services:
  # 一次性：先顺序执行 database/migrations 下全部正式迁移，再幂等创建 MinIO Bucket。
  # 迁移账号需在目标 schema 拥有 DDL 与 advisory lock 权限；MinIO 账号需 makeBucket 权限。
  # 失败则退出码非 0，依赖它的应用因 depends_on 不会启动。
  bootstrap:
    <<: *backend
    image: enterprise-rag/platform-api:0.1.0-dev
    restart: 'no'
    command:
      [
        'sh',
        '-lc',
        './node_modules/.bin/tsx scripts/migrate.ts && ./node_modules/.bin/tsx scripts/seed-storage.ts',
      ]
    depends_on: []

  platform-api:
    <<: *backend
    image: enterprise-rag/platform-api:0.1.0-dev
    environment: { APP_NAME: platform-api, HTTP_PORT: 3000 }
    depends_on:
      bootstrap: { condition: service_completed_successfully }
    healthcheck:
      <<: *app-healthcheck
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)})",
        ]

  rag-query-service:
    <<: *backend
    image: enterprise-rag/rag-query-service:0.1.0-dev
    environment: { APP_NAME: rag-query-service, HTTP_PORT: 3001 }
    depends_on:
      bootstrap: { condition: service_completed_successfully }
    healthcheck:
      <<: *app-healthcheck
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)})",
        ]

  document-parser-service:
    <<: *backend
    image: enterprise-rag/document-parser-service:0.1.0-dev
    environment: { APP_NAME: document-parser-service, HTTP_PORT: 8104 }
    # Parser 处理不可信文件：只读 + 全降权 + 资源限制；临时目录落在 tmpfs 挂载的 /app/.data。
    read_only: true
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /app/.data:size=512m,mode=0700
    healthcheck:
      <<: *app-healthcheck
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8104/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)})",
        ]

  ingestion-worker:
    <<: *backend
    image: enterprise-rag/ingestion-worker:0.1.0-dev
    environment: { APP_NAME: ingestion-worker, PROBE_PORT: 3002 }
    depends_on:
      document-parser-service: { condition: service_healthy }
      bootstrap: { condition: service_completed_successfully }
    healthcheck:
      <<: *app-healthcheck
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3002/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)})",
        ]

  scheduler-worker:
    <<: *backend
    image: enterprise-rag/scheduler-worker:0.1.0-dev
    environment: { APP_NAME: scheduler-worker, PROBE_PORT: 3003 }
    depends_on:
      bootstrap: { condition: service_completed_successfully }
    healthcheck:
      <<: *app-healthcheck
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3003/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)})",
        ]

  # Web Console 同源 /api 反向代理：conversations/runs/run-streams/citations 到 rag-query-service:3001，
  # 其余 /api 到 platform-api:3000。仅发布 8080；后端端口不映射到宿主机。
  web-console:
    image: enterprise-rag/web-console:0.1.0-dev
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'
    stop_grace_period: 30s
    ports: ['${WEB_PORT:-8080}:8080']
    depends_on:
      platform-api: { condition: service_healthy }
      rag-query-service: { condition: service_healthy }
    networks: [rag-net]
    healthcheck:
      <<: *app-healthcheck
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]

networks:
  rag-net:
    driver: bridge
