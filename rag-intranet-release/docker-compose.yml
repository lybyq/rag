name: rag-intranet-release

# 仅编排 6 个应用镜像和一次性 Bootstrap。PG、两个 Redis、MinIO、Milvus、
# GLM-4.7、Embedding、Reranker、PaddleOCR 均由 .env 指向已部署的内网服务。
# 镜像标签来自 images.env；内网启动不 build、不 pull、不访问公网。

x-backend: &backend
  restart: unless-stopped
  env_file:
    - path: ${RAG_RUNTIME_ENV_FILE:-./.env}
      required: true
  networks: [rag-net]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: '50m'
      max-file: '5'
  stop_grace_period: 30s

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 30s

services:
  # OPS-014：先迁移 PG；默认再幂等创建 MinIO Bucket。若企业对象存储账号没有建桶权限，
  # 先让管理员创建 Bucket，并在 .env 设置 STORAGE_INIT_ENABLED=false。
  bootstrap:
    <<: *backend
    image: ${PLATFORM_API_IMAGE:?images.env 缺少 PLATFORM_API_IMAGE}
    restart: 'no'
    command:
      - sh
      - -lc
      - >-
        ./node_modules/.bin/tsx scripts/migrate.ts &&
        if [ "$${STORAGE_INIT_ENABLED:-true}" = "true" ]; then
          ./node_modules/.bin/tsx scripts/seed-storage.ts;
        else
          echo '已跳过 MinIO 建桶；启动方必须保证所需 Bucket 已存在。';
        fi

  platform-api:
    <<: *backend
    image: ${PLATFORM_API_IMAGE:?images.env 缺少 PLATFORM_API_IMAGE}
    environment:
      APP_NAME: platform-api
      HTTP_PORT: 3000
    depends_on:
      bootstrap: { condition: service_completed_successfully }
    healthcheck:
      <<: *healthcheck
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]

  rag-query-service:
    <<: *backend
    image: ${RAG_QUERY_SERVICE_IMAGE:?images.env 缺少 RAG_QUERY_SERVICE_IMAGE}
    environment:
      APP_NAME: rag-query-service
      HTTP_PORT: 3001
    depends_on:
      bootstrap: { condition: service_completed_successfully }
    healthcheck:
      <<: *healthcheck
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]

  document-parser-service:
    <<: *backend
    image: ${DOCUMENT_PARSER_SERVICE_IMAGE:?images.env 缺少 DOCUMENT_PARSER_SERVICE_IMAGE}
    environment:
      APP_NAME: document-parser-service
      HTTP_PORT: 8104
    read_only: true
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    tmpfs:
      - /tmp:size=256m,mode=1777
      # Node 官方镜像中的非 root 用户是 1000:1000；只设 mode=0700 会让目录归 root、Parser 无法写入。
      - /app/.data:size=512m,mode=0700,uid=1000,gid=1000
    depends_on:
      bootstrap: { condition: service_completed_successfully }
    healthcheck:
      <<: *healthcheck
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8104/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]

  ingestion-worker:
    <<: *backend
    image: ${INGESTION_WORKER_IMAGE:?images.env 缺少 INGESTION_WORKER_IMAGE}
    environment:
      APP_NAME: ingestion-worker
      PROBE_PORT: 3002
    depends_on:
      bootstrap: { condition: service_completed_successfully }
      document-parser-service: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3002/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]

  scheduler-worker:
    <<: *backend
    image: ${SCHEDULER_WORKER_IMAGE:?images.env 缺少 SCHEDULER_WORKER_IMAGE}
    environment:
      APP_NAME: scheduler-worker
      PROBE_PORT: 3003
    depends_on:
      bootstrap: { condition: service_completed_successfully }
    healthcheck:
      <<: *healthcheck
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3003/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]

  # 只有 Web 端口暴露给内网用户；所有业务 API 通过同源 Nginx 转发。
  web-console:
    image: ${WEB_CONSOLE_IMAGE:?images.env 缺少 WEB_CONSOLE_IMAGE}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'
    stop_grace_period: 30s
    ports: ['${WEB_BIND:-8080}:8080']
    depends_on:
      platform-api: { condition: service_healthy }
      rag-query-service: { condition: service_healthy }
    networks: [rag-net]
    healthcheck:
      <<: *healthcheck
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]

networks:
  rag-net:
    driver: bridge
