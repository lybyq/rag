server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # 查询面必须在通用 /api 路由之前匹配。开发环境由 Vite 做同样的分流；
  # 若生产网关遗漏这一层，聊天、Run、SSE 和引用请求会误入 Platform API。
  location ~ ^/api/v1/(conversations|runs|run-streams|citations)(/|$) {
    proxy_pass http://rag-query-service:3001;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 180s;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://platform-api:3000;
    proxy_http_version 1.1;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # OPS-006：浏览器不能用容器内服务名，也不能把 localhost 当成部署服务器。
  # 只暴露三个精确的存活探针路径，供运维页面同源读取，不扩大 Worker/Query 的攻击面。
  location = /query-probe/api/v1/health/live {
    limit_except GET { deny all; }
    proxy_pass http://rag-query-service:3001/api/v1/health/live;
  }

  location = /ingestion-probe/api/v1/health/live {
    limit_except GET { deny all; }
    proxy_pass http://ingestion-worker:3002/api/v1/health/live;
  }

  location = /scheduler-probe/api/v1/health/live {
    limit_except GET { deny all; }
    proxy_pass http://scheduler-worker:3003/api/v1/health/live;
  }
}
