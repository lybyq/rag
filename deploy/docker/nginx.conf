server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # 查询面必须在通用 /api 路由之前匹配。开发环境由 Vite 做同样的分流；
  # 若生产网关遗漏这一层，聊天、Run、SSE 和引用请求会误入 Platform API。
  location ~ ^/api/v1/(conversations|runs|run-streams|citations)(/|$) {
    proxy_pass http://rag-query-service:3001;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 180s;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://platform-api:3000;
    proxy_http_version 1.1;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
