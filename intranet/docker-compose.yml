name: enterprise-rag-intranet-existing

# 本 Compose 只编排 6 个应用镜像和两个一次性初始化服务（migrate / storage-init）。
# PostgreSQL、Redis、MinIO、Milvus 和全部模型服务均使用 runtime.env 指向的现有内网地址，
# 不在本 Compose 中重复部署，也不会在启动时访问公网。
#
# 运行时配置统一通过 RAG_ENV_FILE 指向 runtime.env；镜像版本通过 images.env 注入。

x-backend: &backend
  restart: unless-stopped
  env_file:
    - path: ${RAG_ENV_FILE:-./runtime.env}
      required: true
  networks: [rag-platform]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: '50m'
      max-file: '5'
  stop_grace_period: 30s

x-app-healthcheck: &app-healthcheck
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 20s

services:
  # 一次性：执行 database/migrations 下全部正式迁移。迁移账号需在目标 schema 拥有 DDL 与 advisory lock 权限。
  migrate:
    <<: *backend
    image: ${PLATFORM_API_IMAGE:?请在 images.env 配置 PLATFORM_API_IMAGE}
    restart: 'no'
    command: ['./node_modules/.bin/tsx', 'scripts/migrate.ts']
    depends_on: []

  # 一次性：幂等创建 rag-quarantine、rag-derived、rag-documents、rag-artifacts 四个 Bucket。
  # 仅在 --profile init 下手动触发一次，避免普通重启使用高权限账号。
  # 若应用 MinIO 账号没有 makeBucket 权限，请管理员预先创建后再以最小权限账号运行应用。
  storage-init:
    <<: *backend
    image: ${PLATFORM_API_IMAGE:?请在 images.env 配置 PLATFORM_API_IMAGE}
    restart: 'no'
    profiles: [init]
    command: ['./node_modules/.bin/tsx', 'scripts/seed-storage.ts']

  platform-api:
    <<: *backend
    image: ${PLATFORM_API_IMAGE:?请在 images.env 配置 PLATFORM_API_IMAGE}
    environment: { APP_NAME: platform-api, HTTP_PORT: 3000 }
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      <<: *app-healthcheck
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)})",
        ]

  rag-query-service:
    <<: *backend
    image: ${RAG_QUERY_SERVICE_IMAGE:?请在 images.env 配置 RAG_QUERY_SERVICE_IMAGE}
    environment: { APP_NAME: rag-query-service, HTTP_PORT: 3001 }
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      <<: *app-healthcheck
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)})",
        ]

  document-parser-service:
    <<: *backend
    image: ${DOCUMENT_PARSER_SERVICE_IMAGE:?请在 images.env 配置 DOCUMENT_PARSER_SERVICE_IMAGE}
    environment: { APP_NAME: document-parser-service, HTTP_PORT: 8104 }
    # Parser 处理不可信文件，按只读 + 全降权 + 资源限制加固；临时目录落在 tmpfs 挂载的 /app/.data。
    read_only: true
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /app/.data:size=512m,mode=0700
    healthcheck:
      <<: *app-healthcheck
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8104/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)})",
        ]

  ingestion-worker:
    <<: *backend
    image: ${INGESTION_WORKER_IMAGE:?请在 images.env 配置 INGESTION_WORKER_IMAGE}
    environment: { APP_NAME: ingestion-worker, PROBE_PORT: 3002 }
    depends_on:
      document-parser-service: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      <<: *app-healthcheck
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3002/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)})",
        ]

  scheduler-worker:
    <<: *backend
    image: ${SCHEDULER_WORKER_IMAGE:?请在 images.env 配置 SCHEDULER_WORKER_IMAGE}
    environment: { APP_NAME: scheduler-worker, PROBE_PORT: 3003 }
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      <<: *app-healthcheck
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3003/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)})",
        ]

  # Web Console 使用同源 /api 反向代理：conversations/runs/run-streams/citations 到 rag-query-service，
  # 其余 /api 到 platform-api。只发布 8080；后端端口不映射到宿主机，避免 trusted-header 被绕过直连。
  web-console:
    image: ${WEB_CONSOLE_IMAGE:?请在 images.env 配置 WEB_CONSOLE_IMAGE}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'
    stop_grace_period: 30s
    ports: ['${WEB_BIND:-8080}:8080']
    depends_on:
      platform-api: { condition: service_healthy }
      rag-query-service: { condition: service_healthy }
    networks: [rag-platform]
    healthcheck:
      <<: *app-healthcheck
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]

networks:
  rag-platform:
    driver: bridge
